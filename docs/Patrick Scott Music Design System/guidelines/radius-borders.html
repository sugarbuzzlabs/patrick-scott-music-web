<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Sharp corners, 1px hairlines" name="Radii & borders" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-primary);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;padding:20px}
.mono{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body>
<div style="padding:24px;display:flex;gap:12px;align-items:stretch">
  <div style="flex:1;border:1px solid var(--border-subtle);padding:14px"><div class="mono">border-subtle · radius 0</div><div style="font-weight:700;margin-top:4px">Default card edge</div></div>
  <div style="flex:1;border:1px solid var(--border-strong);padding:14px"><div class="mono">border-strong · hover</div><div style="font-weight:700;margin-top:4px">Hover / active</div></div>
  <div style="flex:1;border:1px solid var(--border-accent);border-radius:var(--radius-sm);padding:14px"><div class="mono" style="color:var(--text-accent)">border-accent · radius-sm 2px</div><div style="font-weight:700;margin-top:4px">Live / focused</div></div>
</div></body></html>
