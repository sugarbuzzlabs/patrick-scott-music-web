<!-- @dsCard group="Brand" viewport="700x220" subtitle="Always B&W — grayscale(1) contrast(1.06)" name="Photo treatment" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-primary);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;padding:20px}
.mono{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body>
<div style="padding:20px;display:flex;gap:12px">
  <div style="flex:1"><img src="../assets/photos/closeup-mic.jpg" style="width:100%;height:150px;object-fit:cover;display:block"><div class="mono" style="margin-top:6px">ORIGINAL — NEVER SHIP COLOR</div></div>
  <div style="flex:1"><img src="../assets/photos/closeup-mic.jpg" style="width:100%;height:150px;object-fit:cover;display:block;filter:grayscale(1) contrast(1.06) brightness(.98)"><div class="mono" style="margin-top:6px;color:var(--text-accent)">--photo-filter APPLIED</div></div>
  <div style="flex:1;position:relative"><img src="../assets/photos/hero-bw-stage.png" style="width:100%;height:150px;object-fit:cover;display:block;filter:grayscale(1) contrast(1.06)"><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,11,10,0) 30%,rgba(12,11,10,.88) 85%);display:flex;align-items:flex-end;padding:10px"><span style="font-weight:800;font-stretch:120%;text-transform:uppercase;font-size:15px">Protection gradient</span></div></div>
</div></body></html>
