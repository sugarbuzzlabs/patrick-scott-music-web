<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-primary);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;padding:20px}
.mono{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body>
<div style="padding:24px;display:flex;align-items:center;gap:32px">
  <div style="display:flex;align-items:center;gap:14px">
    <div style="width:56px;height:56px;border:1.5px solid var(--paper);display:flex;align-items:center;justify-content:center;font-weight:900;font-stretch:120%;font-size:24px;letter-spacing:-0.02em">PS</div>
    <div style="font-weight:800;font-stretch:120%;text-transform:uppercase;font-size:20px;line-height:1.05">Patrick<br>Scott</div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;background:var(--accent);color:var(--text-on-accent);padding:16px 20px">
    <div style="width:44px;height:44px;border:1.5px solid var(--ink-950);display:flex;align-items:center;justify-content:center;font-weight:900;font-stretch:120%;font-size:19px">PS</div>
    <div style="font-weight:800;font-stretch:120%;text-transform:uppercase;font-size:16px;line-height:1.05">Patrick<br>Scott</div>
  </div>
  <div class="mono" style="max-width:180px">ARCHIVO 900 IN A 1PX SQUARE. USE PLAIN TYPE WHEREVER A LOGO WOULD GO.</div>
</div></body></html>
