<!-- @dsCard group="Colors" viewport="700x170" subtitle="Semantic aliases in context" name="Semantic usage" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-primary);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;padding:20px}
.mono{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body>
<div style="padding:20px;display:flex;gap:12px">
  <div style="flex:1.4;background:var(--surface-card);border:1px solid var(--border-subtle);padding:16px">
    <div class="mono" style="color:var(--text-accent)">UPCOMING SHOW</div>
    <div style="font-weight:700;font-size:18px;margin-top:6px">text-primary on surface-card</div>
    <div style="color:var(--text-secondary);font-size:14px;margin-top:4px">text-secondary for supporting copy</div>
  </div>
  <div style="flex:1;background:var(--surface-light);color:var(--text-on-light);padding:16px">
    <div class="mono" style="color:var(--ink-600)">PRESS KIT ONLY</div>
    <div style="font-weight:700;font-size:18px;margin-top:6px">surface-light</div>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--text-on-accent);font-weight:800;text-transform:uppercase;letter-spacing:.02em">text-on-accent</div>
</div></body></html>
